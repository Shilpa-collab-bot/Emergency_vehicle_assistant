<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA - Profile</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🚗 EVA</div>
        <div class="user-info">
            <span id="profileRole"></span>
            <button id="backButton" class="logout-btn">Back</button>
        </div>
    </header>
    <main class="dashboard-container">
        <section class="request-card profile-card">
            <h2>My Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" required>
                </div>
                <button type="submit" class="request-btn">Save Profile</button>
            </form>
            <p id="profileMessage" class="message"></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
