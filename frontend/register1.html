
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVA - Register</title>

    <link rel="stylesheet" href="css/register1.css">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>🚗 EVA</h1>
        <p class="subtitle">Emergency Vehicle Assistant</p>

        <h2>Create Account</h2>

        <form id="registerForm">

            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="phone">Phone</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="registerEmail">Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create password"
                    required
                >
            </div>

            <!-- Role -->
            <div class="form-group">
                <label for="role">Register As</label>

                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="user">User</option>
                    <option value="mechanic">Mechanic</option>
                </select>
            </div>

            <!-- Mechanic Details -->
            <div id="mechanicFields" style="display: none;">

                <div class="form-group">
                    <label for="shopName">Shop Name</label>

                    <input
                        type="text"
                        id="shopName"
                        placeholder="Enter shop name"
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter shop address"
                    >
                </div>

                <div class="form-group">
                    <label for="specialization">
                        Specialization
                    </label>

                    <input
                        type="text"
                        id="specialization"
                        placeholder="Example: Bike, Car, Electrical"
                    >
                </div>

                <div class="form-group">
                    <label for="experienceYear">
                        Experience (Years)
                    </label>

                    <input
                        type="number"
                        id="experienceYear"
                        min="0"
                        placeholder="Example: 5"
                    >
                </div>

                <div class="form-group">
                    <label for="latitude">Latitude</label>

                    <input
                        type="number"
                        id="latitude"
                        step="any"
                        placeholder="Example: 12.9716"
                    >
                </div>

                <div class="form-group">
                    <label for="longitude">Longitude</label>

                    <input
                        type="number"
                        id="longitude"
                        step="any"
                        placeholder="Example: 77.5946"
                    >
                </div>

            </div>

            <button type="submit" id="registerButton">
                Register
            </button>

        </form>

        <p id="registerMessage"></p>

        <div class="register-link">
            Already have an account?
            <a href="index2.html">Login</a>
        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/register1.js"></script>

</body>
</html>
