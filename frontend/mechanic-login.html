<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA - Mechanic Login</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>EVA</h1>
            <p class="subtitle">Mechanic Portal</p>
            <h2>Mechanic Login</h2>
            <form id="loginForm">
                <div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div>
                <div class="form-group"><label for="password">Password</label><input id="password" type="password" required></div>
                <button type="submit" id="loginButton">Login</button>
            </form>
            <p id="message"></p>
            <p class="register-link"><a href="index2.html">Back to login</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
